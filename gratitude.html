<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Special Interdenominational Service to mark the 39th Anniversary Celebration of Akwa Ibom State - Sunday 20th September 2026">
  <meta name="theme-color" content="#006400">
  <title>Special Interdenominational Service | Akwa Ibom 39th Anniversary</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a1f0a;
      -webkit-font-smoothing: antialiased;
    }

    /* Mobile-first: image fills the full width, natural height, scrollable if needed */
    .flyer {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      vertical-align: top;
    }

    /* On larger screens, keep it centered and limit extreme stretching */
    @media (min-width: 768px) {
      body {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      .flyer {
        width: 100%;
        max-width: 720px; /* keeps flyer looking sharp, not oversized */
      }
    }
  </style>
</head>
<body>
  <img 
    class="flyer" 
    src="flyer.jpg" 
    alt="Government of Akwa Ibom State - Special Interdenominational Service to mark the 39th Anniversary Celebration. Sunday 20th September 2026, 1:00PM at International Worship Centre, Uyo."
    width="1080"
    height="1350"
    decoding="async"
    fetchpriority="high"
  >
</body>
</html>
